<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xiaomi ESP Flasher</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">&#x1F321;</span> Xiaomi ESP Flasher</div>
  <nav>
    <a href="#/" data-nav="devices">Devices</a>
    <a href="#/firmware" data-nav="firmware">Firmware</a>
    <a href="#/diagnostics" data-nav="diagnostics">Diagnostics</a>
  </nav>
  <div class="right">
    <span id="session-badge" class="badge">IDLE</span>
    <button id="theme-toggle" class="icon-btn" title="Toggle dark mode">&#9788;</button>
  </div>
</header>

<main id="view"></main>

<section class="logpanel" id="logpanel">
  <div class="loghead">
    <strong>OTA Log</strong>
    <span id="conn-state" class="muted">connecting…</span>
    <span class="grow"></span>
    <button class="small" id="log-clear">Clear</button>
    <button class="small" id="log-toggle">Hide</button>
  </div>
  <pre id="log"></pre>
</section>

<div id="modal" class="modal hidden">
  <div class="modal-box" id="modal-box"></div>
</div>
<div id="toast" class="toast hidden"></div>

<!-- Templates -->
<template id="tpl-devices">
  <div class="toolbar">
    <button class="primary" id="btn-scan">Scan</button>
    <button id="btn-refresh">Refresh</button>
    <button id="btn-update-all" class="warn">Update all</button>
    <button id="btn-add">Add MAC…</button>
    <span class="grow"></span>
    <span class="muted" id="dev-count"></span>
  </div>
  <div class="tablewrap">
  <table class="devices">
    <thead><tr>
      <th>Device</th><th>MAC</th><th>Model</th><th>HW</th><th>Firmware</th><th>Temp</th><th>Hum</th><th>Batt</th><th>Signal</th><th>Update</th><th>Status</th>
    </tr></thead>
    <tbody id="dev-rows"></tbody>
  </table>
  </div>
  <p class="muted">Devices appear automatically while the ESP32 scans. Click a row for details. Devices not identified yet are identified automatically one by one when <em>auto_identify</em> is enabled.</p>
</template>

<template id="tpl-device">
  <div class="toolbar">
    <a href="#/" class="linkbtn">&larr; Devices</a>
    <h2 id="d-title"></h2>
    <span class="grow"></span>
    <button id="d-identify" class="primary">Identify / Refresh</button>
    <button id="d-alias">Rename</button>
    <button id="d-forget" class="danger">Forget</button>
  </div>
  <div class="tabs" id="d-tabs">
    <button data-tab="overview" class="active">Overview</button>
    <button data-tab="firmware">Firmware</button>
    <button data-tab="config">Configure</button>
    <button data-tab="diag">Diagnostics</button>
  </div>
  <section class="tab" data-tab="overview">
    <div class="cards">
      <div class="card"><h3>Device Information</h3><dl id="d-info"></dl></div>
      <div class="card"><h3>Measurements</h3><dl id="d-meas"></dl></div>
      <div class="card"><h3>Firmware</h3><dl id="d-fw"></dl>
        <div class="btnrow"><button id="d-update" class="big warn">Update</button><button id="d-config-go" class="big">Configure</button><button id="d-diag-go" class="big">Diagnostics</button></div>
      </div>
    </div>
  </section>
  <section class="tab hidden" data-tab="firmware">
    <div class="card">
      <h3>Firmware update</h3>
      <dl id="d-fwcheck"></dl>
      <label>Target firmware <select id="d-fwsel"></select></label>
      <div class="btnrow">
        <button id="d-flash" class="big danger" disabled>Update firmware</button>
        <button id="d-activate" class="big">Do Activation (stock firmware)</button>
      </div>
      <details><summary>Mi login with known token/bindkey (advanced)</summary>
        <label>Token (24 hex) <input id="d-token" maxlength="24"></label>
        <label>Bind key (32 hex) <input id="d-bindkey" maxlength="32"></label>
      </details>
      <p class="muted">The compatibility check must pass before the button is enabled. A confirmation screen follows.</p>
    </div>
  </section>
  <section class="tab hidden" data-tab="config">
    <!-- Port of the pvvx TelinkMiFlasher "custom firmware" section: same HTML ids, same JS (pvvx_config.js),
         same look (styles scoped under #cfg-pvvx). The BLE link is held by the ESP32 (Connect/Disconnect). -->
    <div id="cfg-pvvx" class="telFlasherClass">
      <button type="button" id="cfg-connect">Connect</button>
      <button type="button" id="cfg-disconnect">Disconnect</button>
      <span id="MAC"></span>
      <div id="percent">Status: Disconnected</div>
      <div id="tempHumiData">Temp/Humidity: waiting notify for data after connecting</div>
      <div id="custcfg"></div>
      <div id="addSensors"></div>
      <div id="ldfrmw"></div>
    </div>
  </section>
  <section class="tab hidden" data-tab="diag">
    <div class="card"><h3>Diagnostics</h3><pre id="d-raw"></pre></div>
  </section>
</template>

<template id="tpl-firmware">
  <div class="toolbar">
    <h2>Firmware repository</h2><span class="grow"></span>
  </div>
  <div class="tablewrap"><table><thead><tr><th>ID</th><th>File</th><th>Version</th><th>Kind</th><th>Size</th><th>CRC32</th><th>Hardware</th><th>Source</th></tr></thead><tbody id="fw-rows"></tbody></table></div>
  <div class="card">
    <h3>Upload your own .bin</h3>
    <p class="muted">The file is validated on the ESP32 (Telink header, size pointer, CRC32) and stored in flash. You must declare the hardware ids it is built for; flashing still requires the confirmation screen.</p>
    <label>File <input type="file" id="fw-file" accept=".bin"></label>
    <label>Version label <input id="fw-version" placeholder="e.g. 5.9"></label>
    <label>Hardware ids (comma separated pvvx ids, default: all LYWSD03MMC) <input id="fw-hw" placeholder="0,3,4,5,10,14"></label>
    <div class="btnrow"><button id="fw-upload" class="warn">Upload to ESP32</button></div>
    <div id="fw-upload-result" class="muted"></div>
  </div>
  <div class="card">
    <h3>GitHub (pvvx/ATC_MiThermometer)</h3>
    <p class="muted">The browser downloads <code>firmware.json</code> and the images from GitHub and stores them on the ESP32 (no internet access needed by the ESP32 itself). Manifest: <span id="fw-manifest-info">?</span></p>
    <div class="btnrow"><button id="fw-refresh-manifest" class="primary">Refresh manifest from GitHub</button></div>
    <div id="fw-remote-list"></div>
  </div>
</template>

<template id="tpl-diagnostics">
  <div class="toolbar"><h2>Diagnostics</h2><span class="grow"></span><button id="diag-refresh">Refresh</button></div>
  <div class="card"><dl id="diag-list"></dl></div>
</template>

<script src="/pvvx_config.js"></script>
<script src="/app.js"></script>
</body>
</html>
